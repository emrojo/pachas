  app:
    image: ${PACHAS_IMAGE:-ghcr.io/emrojo/pachas:latest}
    container_name: pachas_app
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres_db}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-pachas_admin}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres_db}:5432/${POSTGRES_DB:-pachas}}
      # Motor OCR de Visión IA (Ollama / ScanBills por defecto, Gemini como alternativa)
      # NOTA IMPORTANTE RED DOCKER (proxy-network):
      # - La comunicación inter-contenedor usa el puerto interno del servicio web (8000), no el del host (8030).
      # - Si usas CPU (scan-bills-ocr/docker-compose.cpu.yml): usa scanbills-web-cpu:8000 y qwen2.5vl:3b
      # - Si usas GPU (scan-bills-ocr/docker-compose.yml): usa scanbills-web:8000 y qwen2.5vl:7b
      - OCR_PROVIDER=${OCR_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://scanbills-ollama-cpu:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5vl:3b}
      - SCANBILLS_OCR_URL=${SCANBILLS_OCR_URL:-http://scanbills-web-cpu:8000}
      # Autenticación con Google (OAuth 2.0)
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}}
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   postgrest:
    #     condition: service_started
    networks:
      - proxy-network
    # healthcheck:
    #   test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
    #   interval: 20s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

