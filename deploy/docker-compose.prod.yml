  app:
    image: ${PACHAS_IMAGE:-ghcr.io/emrojo/pachas:latest}
    container_name: pachas_app
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgres://${POSTGRES_USER:-pachas_admin}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB:-pachas}
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   postgrest:
    #     condition: service_started
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

