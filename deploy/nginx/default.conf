# ==============================================================================
# PACHAS - PRODUCTION NGINX VIRTUAL HOST CONFIGURATION
# ==============================================================================

# Upstream definitions
upstream pachas_app_upstream {
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream pachas_postgrest_upstream {
    server postgrest:3001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum payload size (receipts, photos)
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Security Headers at Reverse Proxy level
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting for general traffic
    limit_req zone=general_limit burst=50 nodelay;
    limit_conn addr_limit 20;

    # Let's Encrypt ACME Challenge for Automated SSL Certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Block access to hidden files (.git, .env, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint for external load balancers / monitoring
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Auth routes with strict brute-force protection
    location ~* ^/(login|register) {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://pachas_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # PostgREST REST API proxy (if accessed directly)
    location /api/v1/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://pachas_postgrest_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Static Cache Optimization (_next/static, icons, images)
    location /_next/static/ {
        proxy_pass http://pachas_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js Application Proxy
    location / {
        proxy_pass http://pachas_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

