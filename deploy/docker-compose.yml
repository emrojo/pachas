version: '3.8'

# ==============================================================================
# PACHAS - DOCKER COMPOSE SPECIFICATION (LOCAL DEV / SINGLE-NODE TESTING)
# ==============================================================================
# Uso: docker compose -f deploy/docker-compose.yml up -d --build
# ==============================================================================

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:3001}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key}
    image: pachas:latest
    container_name: pachas_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:3001}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key}
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
    networks:
      - pachas_network

  postgres:
    image: postgres:15-alpine
    container_name: pachas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pachas}
      POSTGRES_USER: ${POSTGRES_USER:-pachas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pachas_secure_password_123!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pachas_admin} -d ${POSTGRES_DB:-pachas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pachas_network

  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: pachas_postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-pachas_admin}:${POSTGRES_PASSWORD:-pachas_secure_password_123!}@postgres:5432/${POSTGRES_DB:-pachas}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-pachas_admin}
      PGRST_SERVER_PORT: 3001
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pachas_network

networks:
  pachas_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
